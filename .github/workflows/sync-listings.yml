name: 同步永慶待售物件清單

on:
  schedule:
    # UTC 22:00 = 台灣時間隔天早上 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取永慶房仲網物件清單
        run: node scripts/sync-listings.mjs

      - name: 提交並推送(若有變更)
        run: |
          git config user.name "sala-listings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/listings.json .sync-debug 2>/dev/null || git add src/data/listings.json
          if git diff --staged --quiet; then
            echo "沒有變化,略過提交"
          else
            git commit -m "自動更新待售物件清單 $(date -u +'%Y-%m-%d')"
            git push
          fi
